<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fbe9f0">
  <meta name="description" content="Kho ảnh 20-10">
  <title>Kho ảnh · 20-10</title>
  <link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin>
  <link rel="stylesheet" href="./css/gallery.css?v=row-major-21">
</head>
<body>
  <main class="album" aria-label="Kho ảnh">
    <div id="track" class="track" aria-label="Lưới ảnh toàn màn hình, vuốt ngang để xem"></div>
  </main>
  <p id="message" class="sr-only" role="status" aria-live="polite"></p>

  <!-- Full-screen horizontal card stack. Native touch swipe; mouse drag on desktop. -->
  <dialog id="viewer" class="viewer" aria-label="Bộ ảnh">
    <button class="viewer-close" id="closeViewer" type="button" aria-label="Đóng bộ ảnh">×</button>
    <div id="viewerRail" class="viewer-rail" tabindex="0" role="region" aria-roledescription="Dải ảnh" aria-label="Các ảnh xếp ngang, kéo hoặc vuốt để xem"></div>
  </dialog>
  <script type="module" src="./js/gallery.js?v=row-major-21"></script>
</body>
</html>
